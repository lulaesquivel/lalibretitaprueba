<div class="shell">
  <nav class="marca" aria-label="La Libretita"><a class="logo" href="https://lalibretita.com">La Libretita</a><span class="linea" aria-hidden="true"></span><span class="pill">Herramienta gratis</span></nav>
  <header class="cabecera"><div>
    <h1>Calculadora de costos y precios</h1>
    <p>Cargá los costos de un servicio, tus gastos fijos y tu meta de ingresos, y mirá cuánto te queda con el precio que cobrás. Todo se guarda en tu celular.</p>
  </div></header>
  <main id="main"></main>

    <div class="nav-inner">
      <button class="btn btn-ghost" id="btn-back" onclick="prevStep()">Atrás</button>

    </div>

<script>
/* ---------- state ---------- */
const STORAGE_KEY = 'll_costos_v1';

function defaultExtra(nombre) {
  return {
    nombre: nombre || '',
    diasObra: 2, personas: 1,
    materiales: 0, jornal: 0, fletes: 0, alquilerEquipos: 0, otrosVar: 0, imprevistos: 0,
    precioOjo: 0, sueldoObra: 0, trabaja: false, extraCostos: [],
    diasVos: 2, horasVos: 8, valorHora: 0
  };
}

const defaultState = {
  step1: 0,
  fase1: {
    nombreParticipante: '',
    obraNombre: '',
    diasObra: 3,
    personas: 1,
    diasVos: 3,
    horasVos: 8,
    precioOjo: 0,
    materiales: 0,
    jornal: 0,
    valorHoraTuya: 0,
    fletes: 0,
    alquilerEquipos: 0,
    otrosVar: 0,
    imprevistos: 0,
    extraCostos: [],
    metaMensual: 0,
    metaEsFija: false,
    alquilerLocal: 0,
    servicios: 0,
    vehiculo: 0,
    celular: 0,
    seguro: 0,
    comerciales: 0,
    publicidad: 0,
    extraFijos: [],
    personalEmpresa: 0,
    extraPersonal: [],
    extras: []
  }
};

function loadState() {
  const base = JSON.parse(JSON.stringify(defaultState));
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return base;
    const parsed = JSON.parse(raw);
    if (parsed.step1) base.step1 = parsed.step1;
    if (parsed.fase1) Object.assign(base.fase1, parsed.fase1);
    return base;
  } catch (e) {
    return base;
  }
}

let state = loadState();

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { /* storage unavailable — keep working in-memory */ }
}

/* ---------- helpers ---------- */
function money(n) {
  n = Math.round(n || 0);
  return '$' + n.toLocaleString('es-AR');
}
function num(v) {
  if (typeof v === 'string') {
    const t = v.trim();
    if (/^\d{1,3}(\.\d{3})+$/.test(t)) v = t.replace(/\./g, '');
  }
  const n = parseFloat(v); return isNaN(n) ? 0 : n;
}
function fmtMiles(v) {
  const n = Math.round(num(v));
  return n ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
}
// formatea con puntos mientras se escribe (antes de que corra el oninput del campo)
document.addEventListener('input', e => {
  const el = e.target;
  if (!el || !el.classList || !el.classList.contains('money')) return;
  const pos = el.selectionStart || 0;
  const digitosAntes = el.value.slice(0, pos).replace(/\D/g, '').length;
  const digitos = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  const fmt = digitos ? digitos.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
  el.value = fmt;
  let cuenta = 0, nuevo = 0;
  while (nuevo < fmt.length && cuenta < digitosAntes) { if (/\d/.test(fmt[nuevo])) cuenta++; nuevo++; }
  try { el.setSelectionRange(nuevo, nuevo); } catch (_) {}
}, true);
function calcVariable(o) {
  const manoObra = num(o.jornal) * num(o.personas) * num(o.diasObra);
  const extraTotal = (o.extraCostos || []).reduce((sum, e) => sum + num(e.monto), 0);
  const total = num(o.materiales) + manoObra + num(o.fletes) + num(o.alquilerEquipos) + num(o.otrosVar) + num(o.imprevistos) + extraTotal;
  return { manoObra, extraTotal, total };
}
function precioBoxHTML(precio, costoVariable, ingresoVar, labelVar) {
  precio = num(precio); costoVariable = num(costoVariable); ingresoVar = num(ingresoVar);
  const margen = precio - costoVariable - ingresoVar;
  const head = `<div class="precio-box-header"><span>Precio del servicio</span><span class="amt">${money(precio)}</span></div>`;
  if (margen < 0) {
    const titulo = precio < costoVariable ? 'No te cubre ni el costo variable'
      : (labelVar === 'Tu trabajo en este servicio' ? 'No te cubre tu trabajo' : 'No te cubre tu meta de ingresos');
    const detalle = `Costos variables: ${money(costoVariable)}` + (ingresoVar > 0 ? ` · ${labelVar}: ${money(ingresoVar)}` : '');
    return `<div class="precio-box">${head}
      <div class="precio-box-stack">
        <div class="precio-box-seg seg-warn" style="flex-grow:1;min-height:70px">
          <span class="seg-label">${titulo}</span>
          <span class="seg-amt" style="font-size:14px">${detalle}</span>
        </div>
      </div>
    </div>`;
  }
  const segs = [
    { label: 'Margen', value: margen, cls: 'seg-margen', style: '' },
    { label: labelVar, value: ingresoVar, cls: '', style: 'background:var(--blue);' },

function cubreLabelHTML(precio, costoVariable, ingresoVar, labelVar) {

    else if (ingresoVar > 0) txt = `Cubrís tus costos variables y la parte de tu meta de ingresos de estos días, y te queda un margen de ${money(margen)} para cubrir los gastos fijos.`;

function calcFijos() {
  const f = state.fase1;
  const extraFijosTotal = (f.extraFijos || []).reduce((s, e) => s + num(e.monto), 0);
  const extraPersonalTotal = (f.extraPersonal || []).reduce((s, e) => s + num(e.monto), 0);
  const total = num(f.alquilerLocal) + num(f.servicios) + num(f.vehiculo) + num(f.celular) + num(f.seguro) + num(f.comerciales) + num(f.publicidad) + num(f.personalEmpresa) + extraFijosTotal + extraPersonalTotal;

function trabajaEn(o) {
  if ('valorHoraTuya' in o) return o.trabajaVos !== undefined ? !!o.trabajaVos : num(o.valorHoraTuya) > 0;

/* Tabla "Cómo se calcula tu ingreso por esta obra":
   Trabaja + Variable → en variables: tu trabajo (horas × días × valor hora, o tu valor por el servicio).
   Trabaja + Fijo     → en variables: tu trabajo. Si no llega a (meta ÷ 22) × días, la diferencia va a fijos.
   No trabaja + Variable → en variables: (meta ÷ 22) × días de la obra.
   No trabaja + Fijo     → en fijos: (meta ÷ 22) × días de la obra. */
function valorTrabajo(o) {

  if ('valorHora' in o)     return num(o.horasVos) * dias * num(o.valorHora);     // otros servicios

}
function calcIngresoObra(o) {
  const meta = num(state.fase1.metaMensual);

  const esPrincipal = 'valorHoraTuya' in o;
  const trabaja = trabajaEn(o);
  const ingresoTrabajo = !trabaja ? 0 : valorTrabajo(o);
  const metaObra = (meta / 22) * num(o.diasObra);

  if (trabaja) {
    ingreso = ingresoTrabajo;
    labelVar = 'Tu trabajo en este servicio';
    if (fija && meta > 0) {
      const faltante = Math.max(0, metaObra - ingresoTrabajo);
      if (faltante < 1) {
        mensaje = `Con el ingreso por trabajar en este servicio cubrís ${pctMeta(ingresoTrabajo, meta)} de tu meta de ingresos mensual.`;
      } else {
        extraFijo = faltante;
        mensaje = `Lo que ganás trabajando en este servicio (${money(ingresoTrabajo)}) es menos de lo que necesitás para alcanzar tu meta en estos días (${money(metaObra)}). Por eso la diferencia, ${money(faltante)}, se suma a los costos fijos.`;
      }
    }
  } else if (meta > 0) {
    if (!fija) {
      ingreso = metaObra;
      labelVar = 'Para tu meta de ingresos';
      mensaje = `Con este servicio cubrís ${pctMeta(metaObra, meta)} de tu meta de ingresos mensual.`;
    } else {
      extraFijo = metaObra;
      mensaje = `Con este servicio cubrís ${pctMeta(metaObra, meta)} de tu meta de ingresos mensual. Te faltan ${money(Math.max(0, meta - metaObra))} para completarla.`;

/* Lo que le queda a la persona de cada servicio:
     queda = precio − costos variables − fijos de esos días
   y la "vara" contra la que se compara, según trabaje o no y su meta sea fija o variable:
     Trabaja + variable (o sin meta) → su trabajo
     Trabaja + fija                  → su ingreso de estos días: el mayor entre su trabajo y la meta de estos días
     No trabaja + variable           → su parte de la meta de estos días
     No trabaja + fija               → su ingreso fijo de estos días */
function calcBolsillo(o) {
  const f        = state.fase1;
  const precio   = num(o.precioOjo);
  const cv       = calcVariable(o).total;
  const fijos    = calcFijos().porDia * num(o.diasObra);
  const ing      = calcIngresoObra(o);
  const trabaja  = ing.trabaja;
  const trabajo  = ing.ingresoTrabajo;
  const metaMes  = num(f.metaMensual);
  const hayMeta  = metaMes > 0;
  const metaFija = hayMeta && !!f.metaEsFija;
  const metaObra = ing.metaObra;
  const queda    = precio - cv - fijos;
  const costos   = cv + fijos;

  let caso = '', vara = 0, etiqueta = '';
  if (trabaja && !metaFija)      { caso = 'trabajo';  vara = trabajo;                     etiqueta = 'Tu trabajo'; }
  else if (trabaja)              { caso = 'ingresoT'; vara = Math.max(trabajo, metaObra); etiqueta = 'Tu ingreso de estos días'; }
  else if (hayMeta && !metaFija) { caso = 'meta';     vara = metaObra;                    etiqueta = 'Tu parte de la meta'; }
  else if (hayMeta)              { caso = 'fijo';     vara = metaObra;                    etiqueta = 'Tu ingreso fijo'; }

  const extra = queda - vara;
  const pct = vara > 0 ? Math.round(Math.max(0, queda) / vara * 100) : 0;
  const cierreNegocio = extra >= 1 ? ` Y al negocio le quedan ${money(extra)}.` : ' Al negocio no le queda ganancia extra.';
  let cls, titulo, detalle = '';
  let trabajoPrimero = false, numeroTP = null, segTP = null;

  if (precio <= 0) {
    cls = 'even';
    titulo = 'Todavía no cargaste el precio que pasarías por este servicio.';
  } else if (precio < cv) {
    cls = 'loss';
    titulo = `Perdés plata: con este precio no cubrís ni los gastos del servicio (materiales, mano de obra, fletes). ` +
      (fijos > 0.5 ? `Y los ${money(fijos)} de fijos de estos días los tenés que cubrir con otros servicios.` : '');
    if (trabaja && trabajo > 0) detalle = `Además, no te pagás nada por tu trabajo (${money(trabajo)}).`;
    else if (!trabaja && hayMeta) detalle = `Además, no sacás nada para tu meta de estos días (${money(metaObra)}).`;
  } else if (trabaja && trabajo > 0 && queda < trabajo) {
    // si trabaja, lo que deja el servicio (precio − variables) paga PRIMERO su trabajo y después los fijos
    trabajoPrimero = true;
    const margen = precio - cv;
    const pagado = Math.min(margen, trabajo);
    const fijosCubre = Math.min(fijos, margen - pagado);
    const fijosFaltan = fijos - fijosCubre;
    cls = 'even';
    const metaTxt = metaFija ? 'tu ingreso fijo' : 'tu meta de ingresos';
    const lineaMeta = !hayMeta ? '' : (pagado >= metaObra
      ? ` ${pagado >= trabajo ? 'Tu trabajo de estos días' : 'Lo que te pagás'} cubre ${metaFija ? 'todo' : 'toda'} ${metaTxt} de estos días (${money(metaObra)}).`
      : ` ${pagado >= trabajo ? 'Tu trabajo de estos días' : 'Lo que te pagás'} cubre el ${Math.round(pagado / metaObra * 100)}% de ${metaTxt} de estos días (${money(metaObra)}).`);
    if (margen < trabajo) {
      titulo = `Cubrís los gastos del servicio y te pagás ${money(pagado)} de los ${money(trabajo)} que vale tu trabajo (${Math.round(pagado / trabajo * 100)}%).`;
      detalle = (fijos > 0.5 ? `Los ${money(fijos)} de fijos de estos días los tenés que cubrir con otros servicios.` : '') + lineaMeta;
      numeroTP = { label: 'Te pagás por tu trabajo', valor: pagado };
    } else {
      titulo = `Te pagás tu trabajo completo (${money(trabajo)})` +
        (fijosCubre >= 1 ? ` y cubrís ${money(fijosCubre)} de tus costos fijos.` : ', pero no te queda nada para los costos fijos.') +
        ` Los ${money(fijosFaltan)} de fijos que faltan los tenés que cubrir con otros servicios.`;
      detalle = lineaMeta.trim();
      numeroTP = { label: 'Fijos que tenés que cubrir con otros servicios', valor: fijosFaltan };
    }
    segTP = [
      { label: 'Tu trabajo', value: pagado, color: 'var(--blue)', pdf: 'blue' },
      { label: 'Fijos que cubre este servicio', value: fijosCubre, color: 'var(--ochre)', pdf: 'ochre' },
      { label: 'Fijos que cubren otros servicios', value: fijosFaltan, color: 'var(--ochre-light)', texto: 'var(--brick-dark)', pdf: 'ochreLight' }
    ];
    detalle = detalle.trim();
  } else if (queda < 0) {
    // no es pérdida: el servicio cubre sus gastos y una parte de los fijos; el resto lo cubren otros servicios
    cls = 'even';
    titulo = `Con este precio cubrís los gastos del servicio y ${money(precio - cv)} de tus costos fijos. ` +
      `Los ${money(-queda)} de fijos que faltan los tenés que cubrir con otros servicios.`;
    if (trabaja && trabajo > 0) detalle = `Y de este servicio no te queda nada para pagarte tu trabajo (${money(trabajo)}).`;
    else if (!trabaja && hayMeta) detalle = `Y de este servicio no sacás nada para tu meta de estos días (${money(metaObra)}).`;
  } else if (vara <= 0) {
    // no trabaja y no cargó meta, o trabaja pero no cargó el valor de su hora
    cls = queda > 0 ? 'win' : 'even';
    titulo = queda > 0 ? `Ganás ${money(queda)}.` : 'Cubrís todos los costos, pero no te queda ganancia.';
    if (trabaja) detalle = 'Marcaste que trabajás en este servicio: cargá cuánto vale tu hora para ver si te pagás bien.';
    else if (queda > 0) titulo += ' Cargá tu meta de ingresos para saber si te alcanza.';
  } else if (extra < 0) {
    cls = 'even';
    if (caso === 'trabajo')  titulo = `Te pagás ${money(queda)} de los ${money(trabajo)} que vale tu trabajo (${pct}%).`;
    if (caso === 'ingresoT') {
      titulo = `Cubrís ${money(queda)} de los ${money(vara)} de tu ingreso fijo de estos días (${pct}%).`;
      const porTrabajo = Math.min(queda, trabajo), deGanancia = queda - porTrabajo;
      detalle = deGanancia >= 1
        ? `De eso, ${money(porTrabajo)} corresponde a tu trabajo en este servicio y ${money(deGanancia)} sale de la ganancia del negocio para asegurarte tu ingreso fijo.`
        : (trabajo > 0 && queda < trabajo ? `No alcanza ni para pagarte lo que vale tu trabajo (${money(trabajo)}).` : `Todo corresponde a tu trabajo en este servicio.`);
      detalle += ` Los ${money(vara - queda)} que faltan los tenés que sacar de otros servicios.`;
    }
    if (caso === 'meta')     titulo = `Sacás ${money(queda)} de los ${money(vara)} de tu meta de estos días (${pct}%).`;
    if (caso === 'fijo')     titulo = `Cubrís ${money(queda)} de los ${money(vara)} de tu ingreso fijo de estos días (${pct}%).`;
  } else {
    cls = 'win';
    if (caso === 'trabajo') {
      titulo = `Te pagás tu trabajo completo (${money(trabajo)}).` + cierreNegocio;
    } else if (caso === 'ingresoT') {
      titulo = `Cubrís tu ingreso fijo de estos días (${money(vara)})` +
        (metaObra > trabajo ? `: ${money(trabajo)} corresponde a tu trabajo en este servicio y ${money(metaObra - trabajo)} sale de la ganancia del negocio para asegurarte tu ingreso fijo.` : ' con lo que vale tu trabajo.') + cierreNegocio;
    } else if (caso === 'meta') {
      titulo = `Sacás tu parte de la meta de estos días (${money(vara)}).` + cierreNegocio;
    } else {
      titulo = `Cubrís la parte de tu ingreso fijo que le toca a estos días (${money(vara)}).` + cierreNegocio;
    }
  }
  if (precio > 0 && queda >= 0 && !trabajoPrimero) {
    // meta variable: se compara solo lo que te pagás por tu trabajo; la ganancia del negocio aparece aparte, como opción
    if (caso === 'trabajo' && hayMeta && vara > 0) {
      const pagado = Math.min(queda, trabajo);
      const falta = metaObra - pagado;
      const gananciaNeg = Math.max(0, queda - trabajo);
      const quien = pagado >= trabajo ? 'Tu trabajo de estos días' : 'Lo que te pagás';
      if (falta < 1) {
        detalle = `${quien} cubre toda tu meta de ingresos de estos días (${money(metaObra)}).`;
      } else {
        detalle = `${quien} cubre el ${Math.round(pagado / metaObra * 100)}% de tu meta de ingresos de estos días (${money(metaObra)}).`;
        if (gananciaNeg >= falta) detalle += ` Podés usar la ganancia del negocio para cubrir los ${money(falta)} que faltan.`;
        else if (gananciaNeg >= 1) detalle += ` Si usás la ganancia del negocio (${money(gananciaNeg)}), llegás al ${Math.round((pagado + gananciaNeg) / metaObra * 100)}%.`;
      }
    }
    // no trabaja: lo que se lleva sale todo de la ganancia del negocio
    if ((caso === 'meta' || caso === 'fijo') && vara > 0) {
      detalle = 'Como no trabajás en este servicio, todo lo que te llevás sale de la ganancia del negocio.';
      if (extra < 0) detalle += ` Los ${money(-extra)} que faltan los tenés que sacar de otros servicios.`;
      if (caso === 'fijo') detalle += ' Ojo: tu ingreso fijo lo cobrás todos los meses, aunque no haya servicios.';
    }

  // servicios de más de un mes: avisar por qué la meta y los fijos son de varios meses
  const dias = num(o.diasObra);

    const meses = Number.isInteger(m) ? `${m} meses` : `unos ${m.toLocaleString('es-AR')} meses`;
    nota = `Este servicio lleva ${dias} días de trabajo: equivale a ${meses}. Por eso los costos fijos${hayMeta ? ' y tu meta' : ''} se calculan por ${meses}.`;
  }

  const parteVara = Math.min(Math.max(0, queda), vara);
  const segVariables = { label: 'Costos variables', value: cv, color: 'var(--brick)', texto: '#FBF9F4', pdf: 'brick' };
  // si el precio no alcanza para todos los fijos, se muestra qué parte cubre y qué parte queda para otros servicios
  const segFijos = queda < 0
    ? [{ label: 'Fijos que cubre este servicio', value: Math.max(0, precio - cv), color: 'var(--ochre)', pdf: 'ochre' },
       { label: 'Fijos que cubren otros servicios', value: Math.min(fijos, -queda), color: 'var(--ochre-light)', texto: 'var(--brick-dark)', pdf: 'ochreLight' }]
    : [{ label: 'Costo fijo asignado', value: fijos, color: 'var(--ochre)', pdf: 'ochre' }];
  const segIngreso = { label: etiqueta, value: parteVara, color: 'var(--blue)', pdf: 'blue' };
  const segGanancia = { label: vara > 0 ? 'Ganancia del negocio' : 'Ganancia', value: Math.max(0, queda - vara), color: 'var(--verde-seg)', pdf: 'green' };

  if (segTP) segmentos = [segVariables, ...segTP];
  else if (trabaja && caso === 'ingresoT') {
    // trabaja + fija: su trabajo va antes de los fijos; lo que completa su ingreso fijo sale de la ganancia, después de los fijos
    segmentos = [segVariables,
      { label: 'Tu trabajo', value: Math.min(Math.max(0, queda), trabajo), color: 'var(--blue)', pdf: 'blue' },
      ...segFijos,

function resumenServicioHTML(o) {
  const b = calcBolsillo(o);
  const base = Math.max(b.precio, b.costos, 1);
  const color = b.cls === 'loss' ? 'red' : b.cls === 'win' ? 'green' : 'yellow';
  const bar = b.segmentos.map(s => {
    const pct = (s.value / base) * 100;
    return `<div class="precio-box-seg" style="flex-grow:${Math.max(s.value, 1)};min-height:64px;background:${s.color}${s.texto ? ';color:' + s.texto : ''}">

    </div>`;
  }).join('');
  const numero = b.precio <= 0 ? '' : `
    <div style="text-align:center;margin:4px 0 14px">
      <div style="font-size:14px;color:var(--muted)">${b.numeroLabel}</div>
      <div class="display" style="font-size:38px;color:var(--${color})">${money(b.numero)}</div>
    </div>`;
  return `${numero}
    <div class="precio-box">
      <div class="precio-box-header"><span>Precio del servicio</span><span class="amt">${money(b.precio)}</span></div>

    ${b.detalle ? `<div class="help" style="margin:10px 0 16px">${b.detalle}</div>` : ''}
    ${b.nota ? `<div class="help" style="margin:10px 0 16px">${b.nota}</div>` : ''}`;
}

/* ---------- navigation ---------- */
const FASE1_STEPS = 7; // 0..6

function nextStep() {
  faltaNombre = false;
  if (state.step1 < FASE1_STEPS - 1) { state.step1++; }
  saveState();
  render();
  window.scrollTo(0,0);
}
function prevStep() {
  if (state.step1 > 0) state.step1--;
  saveState();
  render();
  window.scrollTo(0,0);
}

function resetAll() {
  if (!confirm('¿Seguro? Se borra TODO: tu nombre, tus costos fijos, tu meta y todos tus servicios. No se puede recuperar.')) return;
  state = JSON.parse(JSON.stringify(defaultState));
  saveState();
  render();
}

/* ---------- field binding ---------- */
function setPath(path, value) {
  const parts = path.split('.');
  let obj = state;
  for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
  const last = parts[parts.length - 1];
  const isText = typeof obj[last] === 'string';
  obj[last] = isText ? value : num(value);
  saveState();
}
function getPath(path) {
  return path.split('.').reduce((o,k) => o[k], state);
}

/* ---------- render ---------- */
function render() {
  if (state.step1 > FASE1_STEPS - 1) state.step1 = FASE1_STEPS - 1;
  const main = document.getElementById('main');
  main.innerHTML = renderFase1();

  const curStep = state.step1;
  const btnBack = document.getElementById('btn-back');
  const btnNext = document.getElementById('btn-next');
  btnBack.style.visibility = (curStep === 0) ? 'hidden' : 'visible';
  btnNext.disabled = false;

  if (curStep === FASE1_STEPS - 1) {
    btnNext.textContent = 'Listo';
    btnNext.disabled = true;
  } else {
    btnNext.textContent = 'Siguiente';
  }
  liveUpdate();
}

function progressDots(total, current) {
  let html = '<div class="step-progress">';
  for (let i = 0; i < total; i++) {
    html += `<div class="dot ${i < current ? 'done' : ''} ${i === current ? 'current' : ''}"></div>`;
  }
  html += '</div>';
  return html;
}

  if (s === 0) {
    const trab = trabajaEn(f);
    body = `

      <div class="card">

        <div class="field" style="margin-bottom:0">

/* ---------- field templates ---------- */
function moneyField(path, label, help) {
  const val = getPath(path);
  return `
    <div class="field">
      <label>${label}</label>
      ${help ? `<div class="help">${help}</div>` : ''}
      <div class="money-input">
        <span>$</span>
        <input type="text" inputmode="numeric" class="money" autocomplete="off" placeholder="0" value="${fmtMiles(val)}" oninput="setPath('${path}', this.value); liveUpdate();">
      </div>
    </div>`;
}
function stepperInline(path, min, max) {
  const val = getPath(path);
  const idSafe = path.replace(/\./g, '-');
  return `
    <div class="stepper-inline">
      <button onclick="stepPath('${path}', -1, ${min}, ${max})">−</button>
      <span class="val" id="stepval-${idSafe}">${val}</span>
      <button onclick="stepPath('${path}', 1, ${min}, ${max})">+</button>
    </div>`;
}
function stepPath(path, delta, min, max) {
  const cur = getPath(path);
  const next = Math.min(max, Math.max(min, cur + delta));
  setPath(path, next);
  // al cambiar los días del servicio: recortar "días que trabajás vos" y redibujar para actualizar su tope
  if (/\.diasObra$/.test(path)) {
    const o = getPath(path.replace(/\.diasObra$/, ''));
    if (num(o.diasVos) > next) o.diasVos = next;
    saveState();
    render();
    return;
  }
  const idSafe = path.replace(/\./g, '-');
  const el = document.getElementById('stepval-' + idSafe);
  if (el) el.textContent = next;
  liveUpdate();
}

    setText('ex-manoobra-' + idx, money(calc.manoObra));

  ].map(([rubro, monto]) => ({ rubro, monto: num(monto) }))
   .concat((f.extraFijos || []).map(e => ({ rubro: e.nombre || 'Otro costo fijo', monto: num(e.monto) })))
   .concat((f.extraPersonal || []).map(e => ({ rubro: 'Personal: ' + (e.nombre || 'sin nombre'), monto: num(e.monto) })))
   .filter(x => x.monto > 0);
  return {
    nombre: nombreActual(),
    servicios: [principal].concat(extras),
    fijos,
    sueldoMensual: num(f.metaMensual),
    sueldoEsFijo: !!f.metaEsFija
  };
}
function firmaDatos(d) { return JSON.stringify(d); }

function envioCardHTML() {
  return `<div class="card envio-card">
    <h3>Tu resumen</h3>
    <p>Descargá un PDF con el resumen de tus servicios: qué parte del precio se va en cada cosa y cuánto te queda.</p>
    <button class="btn btn-ghost" style="width:100%" onclick="descargarMiPDF(this)">Descargar mi resumen (PDF)</button>
  </div>
  <div class="charla"><div>
    <h3>¿Lo vemos juntos?</h3>
    <p style="margin:0">Con estos números podemos ayudarte a ajustar tus precios y armar un plan. Mery &amp; Lula.</p>
    <a href="https://lalibretita.com/#contacto">Escribinos →</a>
  </div></div>`;
}
function refrescarEnvioCard() {
  const card = document.querySelector('.envio-card');
  if (!card) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = envioCardHTML();
  card.replaceWith(tmp.firstElementChild);
}
/* ---------- resumen en PDF ---------- */
function pesosPDF(n) {
  const v = Math.round(num(n));
  const s = String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (v < 0 ? '-$' : '$') + s;
}
function generarPDFResumen() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const f = state.fase1;
  const W = 210, M = 16, CW = W - 2 * M;
  const COL = {
    brick: [27, 42, 74], ochre: [237, 231, 126], blue: [169, 200, 232], blueLight: [211, 227, 243], ochreLight: [246, 242, 200], green: [143, 198, 154],
    red: [179, 54, 26], brickDark: [15, 26, 48], ink: [27, 42, 74], muted: [74, 84, 112],
    card: [251, 249, 244], edge: [27, 42, 74], redBg: [251, 224, 214], greenBg: [220, 235, 221], yellowBg: [246, 242, 200],
    textoVerde: [47, 107, 74], textoAmarillo: [94, 83, 0], celesteMarca: [169, 200, 232]
  };
  const color = (c, t) => t === 'fill' ? doc.setFillColor(...c) : t === 'draw' ? doc.setDrawColor(...c) : doc.setTextColor(...c);
  const font = (size, style) => { doc.setFont('helvetica', style || 'normal'); doc.setFontSize(size); };
  let y = 0;

  const pie = () => {
    font(8); color(COL.muted);
    doc.text('La Libretita · Calculadora de costos y precios · lalibretita.com', M, 289);
    doc.text(String(doc.getNumberOfPages()), W - M, 289, { align: 'right' });
  };
  const nuevaPagina = () => { pie(); doc.addPage(); y = 18; };
  const hayLugar = alto => { if (y + alto > 278) nuevaPagina(); };

  // encabezado
  color(COL.brick, 'fill'); doc.rect(0, 0, W, 30, 'F');
  color([255, 255, 255]); font(9, 'bold'); doc.text('LA LIBRETITA · CALCULADORA DE COSTOS', M, 12);
  font(20, 'bold'); doc.text('Resumen de costos y precios', M, 23);
  y = 42;
  color(COL.ink); font(15, 'bold'); doc.text(nombreActual() || 'Tu negocio', M, y);
  font(9); color(COL.muted);
  doc.text(new Date().toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' }), W - M, y, { align: 'right' });
  y += 9;

  // tu base
  const fijos = calcFijos();
  const cajas = [
    ['Costos fijos por mes', pesosPDF(fijos.total), ''],
    ['Costo fijo por día (fijos / 22)', pesosPDF(fijos.porDia), ''],
    ['Tu meta de ingresos', pesosPDF(f.metaMensual), f.metaEsFija ? 'por mes, como costo fijo' : 'por mes, como costo variable']
  ];
  const cw = (CW - 8) / 3;
  cajas.forEach(([t, v, sub], k) => {
    const x = M + k * (cw + 4);
    color(COL.card, 'fill'); color(COL.edge, 'draw'); doc.setLineWidth(0.3);
    doc.roundedRect(x, y, cw, 22, 2, 2, 'FD');
    font(8); color(COL.muted); doc.text(t, x + 4, y + 6.5);
    font(13, 'bold'); color(COL.ink); doc.text(v, x + 4, y + 14);
    if (sub) { font(7); color(COL.muted); doc.text(sub, x + 4, y + 19); }
  });
  y += 32;

  // servicios
  const servicios = [f].concat(f.extras || []);
  servicios.forEach((o, idx) => {
    const b = calcBolsillo(o);
    const e = { tag: b.titulo, cls: b.cls, totalNecesario: b.costos };
    const msg = (b.precio > 0 ? (b.numeroLabel + ': ') + pesosPDF(b.numero) + '. ' : '') + b.detalle + (b.nota ? ' ' + b.nota : '');
    const v = calcVariable(o);
    const nombre = (idx === 0 ? f.obraNombre : o.nombre) || (idx === 0 ? 'Tu servicio principal' : 'Servicio sin nombre');
    const visibles = b.segmentos.map(x => [x.label, x.value, COL[x.pdf]]);
    const lineasLeyenda = Math.ceil(visibles.length / 2);
    font(9);
    const tagLines = doc.splitTextToSize(e.tag, CW - 10);
    const msgLines = msg ? doc.splitTextToSize(msg, CW) : [];
    const detalle = [
      ['materiales', o.materiales], ['mano de obra', v.manoObra], ['fletes / nafta', o.fletes],
      ['alquiler de equipos', o.alquilerEquipos], ['otros gastos', o.otrosVar], ['imprevistos', o.imprevistos],
      ['otros gastos agregados', v.extraTotal]
    ].filter(x => num(x[1]) > 0).map(x => `${x[0]} ${pesosPDF(x[1])}`).join(' · ');
    font(8);
    const detLines = detalle ? doc.splitTextToSize('Costos variables: ' + detalle, CW) : [];
    const alto = 5 + 18 + lineasLeyenda * 6 + 2 + tagLines.length * 4.5 + 10 + (detLines.length ? detLines.length * 4 + 1.5 : 0) + msgLines.length * 4.6 + 6;
    hayLugar(alto);

    // título + precio
    font(13, 'bold'); color(COL.ink); doc.text(nombre, M, y);
    font(9); color(COL.muted); doc.text('Precio', W - M - 38, y, { align: 'right' });
    font(13, 'bold'); color(COL.ink); doc.text(pesosPDF(b.precio), W - M, y, { align: 'right' });
    y += 5;

    // barra apilada
    const base = Math.max(b.precio, e.totalNecesario, 1);
    let x = M;
    visibles.forEach(([, val, col]) => {
      const w = (val / base) * CW;
      color(col, 'fill'); doc.rect(x, y, w, 10, 'F');
      x += w;
    });
    if (e.totalNecesario > b.precio && b.precio > 0) {
      const px = M + (b.precio / base) * CW;
      color(COL.ink, 'draw'); doc.setLineWidth(0.6); doc.line(px, y - 1.5, px, y + 11.5);
      font(7, 'bold'); color(COL.ink); doc.text('tu precio', px, y + 14.5, { align: 'center' });
    }
    y += 18;

    // leyenda en dos columnas
    visibles.forEach(([lab, val, col], k) => {
      const lx = M + (k % 2) * (CW / 2);
      const ly = y + Math.floor(k / 2) * 6;
      color(col, 'fill'); doc.rect(lx, ly - 3, 3.5, 3.5, 'F');
      font(9); color(COL.ink); doc.text(lab, lx + 5.5, ly);
      font(9, 'bold'); doc.text(pesosPDF(val), lx + CW / 2 - 6, ly, { align: 'right' });
    });
    y += lineasLeyenda * 6 + 2;

    // estado (mensaje de color)
    const bg = e.cls === 'loss' ? COL.redBg : e.cls === 'win' ? COL.greenBg : COL.yellowBg;
    const fg = e.cls === 'loss' ? COL.red : e.cls === 'win' ? COL.textoVerde : COL.textoAmarillo;
    const hBanner = tagLines.length * 4.5 + 5;
    color(bg, 'fill'); doc.roundedRect(M, y, CW, hBanner, 2, 2, 'F');
    font(9, 'bold'); color(fg); doc.text(tagLines, M + 5, y + 5.5);
    y += hBanner + 5;

    if (detLines.length) { font(8); color(COL.muted); doc.text(detLines, M, y); y += detLines.length * 4 + 1.5; }
    if (msgLines.length) { font(9); color(COL.ink); doc.text(msgLines, M, y); y += msgLines.length * 4.6; }

    y += 5;
    color(COL.edge, 'draw'); doc.setLineWidth(0.3); doc.line(M, y, W - M, y);
    y += 10;
  });

  hayLugar(14);
  font(9); color(COL.muted);
  doc.text(doc.splitTextToSize('¿Querés que veamos juntos estos números y armemos un plan? Escribinos en lalibretita.com. Mery & Lula.', CW), M, y);
  pie();
  return doc;
}
function nombreArchivoPDF() {
  const limpio = (nombreActual() || 'mi_negocio').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^A-Za-z0-9 ]+/g, '').trim().replace(/\s+/g, '_');
  return `La_Libretita_Costos_${limpio || 'mi_negocio'}.pdf`;
}
async function descargarMiPDF(btn) {
  if (!window.jspdf) {
    alert('No se pudo preparar el PDF. Revisá tu conexión y volvé a intentar.');
    return;
  }
  const original = btn.textContent;
  btn.textContent = 'Armando tu resumen…';
  btn.disabled = true;
  try {
    generarPDFResumen().save(nombreArchivoPDF());
  } catch (err) {
    alert('Hubo un problema al armar el PDF. Probá de nuevo.');
  }
  btn.textContent = original;
  btn.disabled = false;
}

/* ---------- init ---------- */
render();
</script>
